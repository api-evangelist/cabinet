aid: cabinet
name: Cabinet
description: Cabinet is a calendar management and scheduling automation platform built for
  executive assistants and the leaders they support. It brings group scheduling polls, copy-and-paste
  availability, unique booking links, shadow holds, and a shared meeting log into one all-in-one
  workspace, and integrates with Outlook and Google Calendar plus Zoom, Google Meet, and Microsoft
  Teams. Trusted by over 2,000 companies, Cabinet is SOC 2 Type 2 compliant and continuously monitored
  by Secureframe. It was founded by former executive assistant Julia Leibowitz and is backed by Techstars.
